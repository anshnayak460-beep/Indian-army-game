
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operation Tiranga - Jungle Commando</title>

<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101811;color:white;font-family:Arial,sans-serif}
#hud{position:fixed;top:15px;left:15px;z-index:5;display:flex;gap:10px;flex-wrap:wrap}
.panel{background:#101a13dd;border:1px solid #b5c99b66;padding:10px 14px;border-radius:10px;font-weight:bold}
#message{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#07100dcc;z-index:10;text-align:center}
.dialog{background:#17271c;border:1px solid #93a77a;padding:28px;border-radius:16px;width:min(90%,420px)}
h1{color:#e4c878;margin:0 0 10px}
button{border:0;border-radius:9px;padding:12px 18px;background:#d6a83f;color:#151a11;font-size:16px;font-weight:bold;cursor:pointer}
#controls{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 20px;z-index:5;pointer-events:none}
.group{display:flex;gap:12px;pointer-events:auto}
.control{width:60px;height:60px;border-radius:50%;background:#15251cdd;color:white;border:1px solid #b4c9a4;font-size:22px;touch-action:manipulation}
#hint{position:fixed;bottom:8px;left:0;right:0;text-align:center;color:#e4e8d9;font-size:12px;z-index:4;pointer-events:none}
</style>
</head>

<body>
<div id="hud">
  <div class="panel">🏅 Score: <span id="score">0</span></div>
  <div class="panel">❤️ Health: <span id="health">100</span>%</div>
  <div class="panel">⚡ Speed: <span id="speed">1</span>x</div>
</div>

<div id="message">
  <div class="dialog">
    <h1>OPERATION TIRANGA</h1>
    <p>JUNGLE COMMANDO</p>
    <p>Dodge obstacles, jump over barriers and survive the mission.</p>
    <p>Keyboard: ← → to move, ↑ or Space to jump, ↓ to slide.</p>
    <button id="start">START MISSION</button>
  </div>
</div>

<div id="controls">
  <div class="group">
    <button class="control" id="left">◀</button>
    <button class="control" id="right">▶</button>
  </div>
  <div class="group">
    <button class="control" id="slide">⬇</button>
    <button class="control" id="jump">⬆</button>
  </div>
</div>
<div id="hint">Move • Jump • Slide • Avoid obstacles</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);

  let scene, camera, renderer, clock;
  let player, playerBody, playerLegs = [];
  let obstacles = [], scenery = [];
  let running = false, gameOver = false;
  let lane = 1, jumpVelocity = 0, playerY = 0;
  let sliding = false, slideTime = 0;
  let score = 0, health = 100, elapsed = 0;
  let spawnTimer = 0, damageFlash = 0;
  const laneX = [-3, 0, 3];
  const obstacleMaterials = {};

  init();

  function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x82958a);
    scene.fog = new THREE.FogExp2(0x82958a, 0.012);

    camera = new THREE.PerspectiveCamera(
      65, innerWidth / innerHeight, 0.1, 300
    );
    camera.position.set(0, 5.2, 10.5);
    camera.lookAt(0, 1, -5);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    document.body.appendChild(renderer.domElement);

    clock = new THREE.Clock();

    scene.add(new THREE.HemisphereLight(0xc9dfd0, 0x343626, 1.6));

    const sun = new THREE.DirectionalLight(0xffedcc, 2.1);
    sun.position.set(-8, 15, 7);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    sun.shadow.camera.left = -14;
    sun.shadow.camera.right = 14;
    sun.shadow.camera.top = 20;
    sun.shadow.camera.bottom = -20;
    scene.add(sun);

    createWorld();
    createPlayer();
    createScenery();
    createObstacles();
    bindControls();

    addEventListener('resize', onResize);
    $('start').addEventListener('click', startGame);

    renderer.setAnimationLoop(animate);
  }

  function mat(color, roughness = 1) {
    return new THREE.MeshStandardMaterial({
      color, roughness, metalness: 0
    });
  }

  function box(w, h, d, material, x = 0, y = 0, z = 0) {
    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d), material
    );
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    return mesh;
  }

  function createWorld() {
    const soil = mat(0x514c35);
    const road = mat(0x625c43);
    const edge = mat(0x777052);
    const line = mat(0xb6a878);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(180, 250), soil
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.set(0, -0.12, -80);
    ground.receiveShadow = true;
    scene.add(ground);

    const track = new THREE.Mesh(
      new THREE.PlaneGeometry(9, 240), road
    );
    track.rotation.x = -Math.PI / 2;
    track.position.set(0, -0.04, -80);
    track.receiveShadow = true;
    scene.add(track);

    [-4.55, 4.55].forEach(x => {
      const strip = new THREE.Mesh(
        new THREE.BoxGeometry(0.13, 0.03, 240), edge
      );
      strip.position.set(x, 0, -80);
      scene.add(strip);
    });

    // Small, irregular road markers
    for (let z = 8; z > -220; z -= 7) {
      const marker = new THREE.Mesh(
        new THREE.BoxGeometry(0.055, 0.02, 1.8), line
      );
      marker.position.set(0, 0.005, z);
      scene.add(marker);
    }

    // Distant hills
    const hillMat = mat(0x52694d);
    for (let i = 0; i < 16; i++) {
      const hill = new THREE.Mesh(
        new THREE.SphereGeometry(1, 10, 8), hillMat
      );
      hill.scale.set(9 + Math.random() * 9, 4 + Math.random() * 5, 7);
      hill.position.set(
        (Math.random() < 0.5 ? -1 : 1) * (17 + Math.random() * 18),
        -1.5,
        -25 - Math.random() * 150
      );
      scene.add(hill);
    }
  }

  function createTree(x, z, scale = 1) {
    const tree = new THREE.Group();
    tree.position.set(x, 0, z);
    tree.scale.setScalar(scale);

    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.18, 0.32, 2.7, 7),
      mat(0x51402a)
    );
    trunk.position.y = 1.35;
    trunk.castShadow = true;
    tree.add(trunk);

    const greens = [0x263e27, 0x344c2c, 0x405738, 0x2d482b];
    for (let i = 0; i < 4; i++) {
      const crown = new THREE.Mesh(
        new THREE.IcosahedronGeometry(1.25 - i * 0.1, 1),
        mat(greens[Math.floor(Math.random() * greens.length)])
      );
      crown.position.set(
        (Math.random() - 0.5) * 0.65,
        2.5 + i * 0.45,
        (Math.random() - 0.5) * 0.5
      );
      crown.scale.set(1.05, 0.85, 1);
      crown.castShadow = true;
      tree.add(crown);
    }

    scene.add(tree);
    scenery.push(tree);
  }

  function createRock(x, z, scale = 1) {
    const rock = new THREE.Mesh(
      new THREE.DodecahedronGeometry(0.8, 0),
      mat(0x656553)
    );
    rock.position.set(x, 0.35 * scale, z);
    rock.scale.set(scale * 1.2, scale * 0.75, scale);
    rock.rotation.set(Math.random(), Math.random(), Math.random());
    rock.castShadow = true;
    scene.add(rock);
    scenery.push(rock);
  }

  function createScenery() {
    for (let z = 12; z > -210; z -= 6 + Math.random() * 5) {
      createTree(-7 - Math.random() * 8, z, 0.8 + Math.random() * 0.8);
      createTree(7 + Math.random() * 8, z - 3, 0.8 + Math.random() * 0.8);

      if (Math.random() < 0.5) {
        createRock(-5.5 - Math.random() * 3, z - 2, 0.5 + Math.random());
      }
      if (Math.random() < 0.5) {
        createRock(5.5 + Math.random() * 3, z - 4, 0.5 + Math.random());
      }
    }

    // Fern-like roadside plants
    for (let i = 0; i < 65; i++) {
      const side = Math.random() < 0.5 ? -1 : 1;
      const plant = new THREE.Group();
      plant.position.set(side * (5 + Math.random() * 5), 0, 10 - Math.random() * 200);

      for (let j = 0; j < 5; j++) {
        const leaf = new THREE.Mesh(
          new THREE.ConeGeometry(0.13, 0.9, 5),
          mat(0x526c38)
        );
        leaf.position.set((Math.random() - 0.5) * 0.5, 0.38, 0);
        leaf.rotation.z = (Math.random() - 0.5) * 1.3;
        plant.add(leaf);
      }
      scene.add(plant);
      scenery.push(plant);
    }
  }

  function createPlayer() {
    player = new THREE.Group();

    const uniform = mat(0x596446);
    const darkUniform = mat(0x343e2c);
    const skin = mat(0xb78b65);
    const boots = mat(0x262720);
    const helmetMat = mat(0x414b31);

    // Boots and legs
    for (let i = 0; i < 2; i++) {
      const leg = new THREE.Group();
      const pants = box(0.25, 0.62, 0.28, darkUniform, 0, 0.55, 0);
      const boot = box(0.29, 0.18, 0.42, boots, 0, 0.13, -0.05);
      leg.add(pants, boot);
      leg.position.set(i === 0 ? -0.2 : 0.2, 0, 0);
      player.add(leg);
      playerLegs.push(leg);
    }

    // Body
    playerBody = new THREE.Group();
    playerBody.add(box(0.67, 0.78, 0.36, uniform, 0, 1.18, 0));
    playerBody.add(box(0.72, 0.18, 0.4, darkUniform, 0, 0.85, 0));
    playerBody.add(box(0.38, 0.42, 0.15, darkUniform, 0, 1.28, 0.23));

    // Head and helmet
    playerBody.add(box(0.38, 0.42, 0.34, skin, 0, 1.86, 0));
    playerBody.add(box(0.46, 0.19, 0.41, helmetMat, 0, 2.08, 0));
    playerBody.add(box(0.5, 0.06, 0.43, helmetMat, 0, 2.0, 0.02));

    // Backpack
    playerBody.add(box(0.43, 0.55, 0.24, darkUniform, 0, 1.35, -0.29));

    // Arms
    for (let side of [-1, 1]) {
      const arm = box(0.22, 0.65, 0.23, uniform, side * 0.48, 1.22, 0);
      arm.rotation.z = side * -0.12;
      playerBody.add(arm);
    }

    player.add(playerBody);
    player.position.set(0, 0, 0);
    scene.add(player);
  }

  function createObstacles() {
    const wood = mat(0x745032);
    const metal = mat(0x4a5046);
    const rockMat = mat(0x696a58);
    const sandbag = mat(0x8a805e);

    obstacleMaterials.barrier = wood;
    obstacleMaterials.crate = metal;
    obstacleMaterials.rock = rockMat;
    obstacleMaterials.bags = sandbag;

    for (let i = 0; i < 7; i++) {
      spawnObstacle(-32 - i * 24 - Math.random() * 12);
    }
  }

  function spawnObstacle(z) {
    const typeRoll = Math.random();
    const type = typeRoll < 0.35 ? 'barrier'
               : typeRoll < 0.65 ? 'rock'
               : typeRoll < 0.82 ? 'crate' : 'bags';

    const group = new THREE.Group();
    const material = obstacleMaterials[type];

    if (type === 'barrier') {
      group.add(box(2.0, 0.2, 0.3, material, 0, 0.95, 0));
      group.add(box(0.18, 1.05, 0.25, material, -0.75, 0.52, 0));
      group.add(box(0.18, 1.05, 0.25, material, 0.75, 0.52, 0));
      // Yellow warning stripe
      group.add(box(1.8, 0.07, 0.32, mat(0xd0b24e), 0, 0.96, 0.015));
    } else if (type === 'rock') {
      const r = new THREE.Mesh(
        new THREE.DodecahedronGeometry(0.85, 0), material
      );
      r.position.y = 0.58;
      r.scale.set(1.05, 0.8, 0.9);
      r.castShadow = true;
      group.add(r);
    } else if (type === 'crate') {
      group.add(box(1.15, 1.15, 1.0, material, 0, 0.58, 0));
      const stripe = box(1.18, 0.12, 1.03, mat(0x8b8a70), 0, 0.58, 0);
      group.add(stripe);
    } else {
      for (let i = -1; i <= 1; i++) {
        const bag = new THREE.Mesh(
          new THREE.SphereGeometry(0.4, 10, 8), material
        );
        bag.scale.set(1.2, 0.7, 0.85);
        bag.position.set(i * 0.65, 0.35, 0);
        bag.castShadow = true;
        group.add(bag);
      }
    }

    const laneIndex = Math.floor(Math.random() * 3);
    group.position.set(laneX[laneIndex], 0, z);
    group.userData = { type, laneIndex, hit: false };
    scene.add(group);
    obstacles.push(group);
  }

  function bindControls() {
    $('left').addEventListener('pointerdown', () => moveLane(-1));
    $('right').addEventListener('pointerdown', () => moveLane(1));
    $('jump').addEventListener('pointerdown', jump);
    $('slide').addEventListener('pointerdown', slide);

    addEventListener('keydown', e => {
      if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) {
        e.preventDefault();
      }
      if (e.repeat) return;
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') moveLane(-1);
      if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') moveLane(1);
      if (e.key === 'ArrowUp' || e.key === ' ') jump();
      if (e.key === 'ArrowDown' || e.key.toLowerCase() === 's') slide();
    });
  }

  function moveLane(direction) {
    if (!running) return;
    lane = Math.max(0, Math.min(2, lane + direction));
  }

  function jump() {
    if (!running || playerY > 0.02 || sliding) return;
    jumpVelocity = 8.5;
  }

  function slide() {
    if (!running || playerY > 0.05) return;
    sliding = true;
    slideTime = 0.75;
  }

  function startGame() {
    score = 0;
    health = 100;
    elapsed = 0;
    lane = 1;
    playerY = 0;
    jumpVelocity = 0;
    sliding = false;
    gameOver = false;
    running = true;
    spawnTimer = 0;

    obstacles.forEach(o => scene.remove(o));
    obstacles = [];
    for (let i = 0; i < 7; i++) {
      spawnObstacle(-30 - i * 25 - Math.random() * 10);
    }

    player.position.set(0, 0, 0);
    $('score').textContent = '0';
    $('health').textContent = '100';
    $('message').style.display = 'none';
    clock.getDelta();
  }

  function endGame() {
    if (gameOver) return;
    running = false;
    gameOver = true;
    $('message').style.display = 'flex';
    $('message').innerHTML = `
      <div class="dialog">
        <h1>MISSION FAILED</h1>
        <p>Final score: <strong>${Math.floor(score)}</strong></p>
        <p>You fought bravely, Commando. Try again!</p>
        <button id="restart">RESTART MISSION</button>
      </div>`;
    $('restart').addEventListener('click', startGame);
  }

  function animate() {
    const dt = Math.min(clock.getDelta(), 0.035);

    if (running) update(dt);
    renderer.render(scene, camera);
  }

  function update(dt) {
    elapsed += dt;
    const speed = Math.min(20, 11 + elapsed * 0.16);
    score += dt * speed * 1.7;

    $('score').textContent = Math.floor(score);
    $('speed').textContent = (speed / 11).toFixed(1);

    // Smooth lane switching
    player.position.x += (laneX[lane] - player.position.x) *
                         Math.min(1, dt * 12);

    // Jump physics
    if (jumpVelocity !== 0 || playerY > 0) {
      playerY += jumpVelocity * dt;
      jumpVelocity -= 22 * dt;
      if (playerY <= 0) {
        playerY = 0;
        jumpVelocity = 0;
      }
    }

    // Slide duration and character posture
    if (sliding) {
      slideTime -= dt;
      if (slideTime <= 0) sliding = false;
    }

    player.position.y = playerY;
    playerBody.scale.y = sliding ? 0.55 : 1;
    playerBody.position.y = sliding ? -0.35 : 0;

    const runSwing = Math.sin(elapsed * 13) * 0.5;
    playerLegs.forEach((leg, i) => {
      leg.rotation.x = playerY > 0.1 ? -0.25 : runSwing * (i === 0 ? 1 : -1);
    });
    playerBody.rotation.z = (laneX[lane] - player.position.x) * -0.04;

    // Obstacles approach the player
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.position.z += speed * dt;

      const nearPlayer = Math.abs(o.position.z) < 1.15 &&
                         Math.abs(o.position.x - player.position.x) < 1.05;

      if (nearPlayer && !o.userData.hit) {
        let avoided = false;
        const type = o.userData.type;

        if (type === 'barrier') {
          avoided = playerY > 0.8;
        } else if (type === 'bags') {
          avoided = sliding;
        } else {
          avoided = playerY > 1.15;
        }

        if (!avoided) {
          o.userData.hit = true;
          health = Math.max(0, health - 25);
          $('health').textContent = health;
          damageFlash = 0.18;
          if (health <= 0) endGame();
        } else {
          o.userData.hit = true;
          score += 30;
        }
      }

      if (o.position.z > 12) {
        scene.remove(o);
        obstacles.splice(i, 1);
      }
    }

    // Spawn new obstacles at a steady interval
    spawnTimer += dt;
    if (spawnTimer > Math.max(0.75, 1.5 - elapsed * 0.004)) {
      spawnTimer = 0;
      spawnObstacle(-90 - Math.random() * 25);
    }

    // Subtle camera movement
    camera.position.x += (player.position.x * 0.22 - camera.position.x) * dt * 2;
    camera.position.y = 5.2 + playerY * 0.12;
    camera.lookAt(player.position.x * 0.18, 1.1 + playerY * 0.15, -5);

    if (damageFlash > 0) {
      damageFlash -= dt;
      renderer.setClearColor(0x6b2119);
    } else {
      renderer.setClearColor(0x82958a);
    }
  }

  function onResize() {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7));
  }
})();
</script>
</body>
</html>
