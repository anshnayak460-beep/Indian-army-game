<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Indian Army Commando 3D</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  overflow: hidden;
  background: #101b12;
  font-family: Arial, sans-serif;
  color: white;
  touch-action: none;
}

canvas {
  display: block;
}

#hud {
  position: fixed;
  inset: 0;
  z-index: 5;
  pointer-events: none;
}

.logo {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  width: 78%;
  font-size: clamp(17px, 4vw, 27px);
  font-weight: 900;
  color: #ffe38b;
  text-shadow: 2px 3px 5px #000;
}

.logo small {
  display: block;
  font-size: 10px;
  letter-spacing: 3px;
  color: white;
  margin-top: 5px;
}

.stats {
  position: absolute;
  top: 12px;
  left: 10px;
  padding: 10px;
  background: #07130bdc;
  border: 1px solid #7d9672;
  border-radius: 10px;
  font-size: 13px;
  line-height: 1.8;
}

#pause {
  position: absolute;
  top: 12px;
  right: 10px;
  padding: 11px 15px;
  font-size: 20px;
  color: white;
  background: #101a17e8;
  border: 1px solid white;
  border-radius: 10px;
  pointer-events: auto;
}

#mission {
  position: absolute;
  top: 105px;
  left: 10px;
  padding: 9px 12px;
  background: #07130bdc;
  border-left: 3px solid #e6bd48;
  border-radius: 7px;
  font-size: 11px;
}

#loading {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: #17251bea;
  padding: 25px;
  font-size: 16px;
  line-height: 1.8;
  pointer-events: auto;
}

#loading button {
  padding: 12px 20px;
  border: 0;
  border-radius: 8px;
  font-weight: bold;
  background: #e4bd42;
  margin-top: 12px;
}

#gameover {
  display: none;
  position: absolute;
  top: 36%;
  width: 100%;
  padding: 24px 10px;
  background: #101a17ed;
  text-align: center;
  pointer-events: auto;
}

#gameover h2 {
  color: #ffdf6a;
}

#restart {
  padding: 13px 23px;
  background: #e3bb40;
  color: #17210f;
  border: none;
  border-radius: 9px;
  font-weight: bold;
}

#controls {
  position: absolute;
  bottom: 22px;
  width: 100%;
  padding: 0 17px;
  display: flex;
  justify-content: space-between;
  align-items: end;
}

.controlGroup {
  display: flex;
  gap: 12px;
}

.btn {
  width: clamp(57px, 16vw, 76px);
  height: clamp(57px, 16vw, 76px);
  border-radius: 50%;
  border: 2px solid #ffffffd9;
  color: white;
  background: #101a17c9;
  font-size: 28px;
  font-weight: bold;
  pointer-events: auto;
  touch-action: none;
  box-shadow: 0 3px 10px #0008;
}

#jump {
  width: clamp(67px, 19vw, 86px);
  height: clamp(67px, 19vw, 86px);
  background: #79601bd9;
}

.hint {
  position: absolute;
  bottom: 108px;
  width: 100%;
  text-align: center;
  font-size: 10px;
  text-shadow: 1px 2px 3px black;
}

@media (max-height: 500px) {
  #controls { bottom: 6px; }
  .btn { width: 50px; height: 50px; }
  #jump { width: 58px; height: 58px; }
  .hint { bottom: 68px; }
  #mission { top: 80px; }
}
</style>
</head>

<body>

<div id="hud">

  <div class="logo">
    🇮🇳 INDIAN ARMY RUNNER 3D
    <small>REALISTIC COMMANDO EDITION</small>
  </div>

  <div class="stats">
    🏆 SCORE: <span id="score">0</span><br>
    🪙 COINS: <span id="coins">0</span>
  </div>

  <button id="pause">Ⅱ</button>

  <div id="mission">
    🎯 MISSION: REACH THE BASE<br>
    Avoid obstacles and collect coins.
  </div>

  <div id="loading">
    <div>
      <h2>🇮🇳 ARMY RUNNER 3D</h2>
      <p id="loadingText">Loading 3D soldier and environment...</p>
      <button id="start" style="display:none">START MISSION</button>
    </div>
  </div>

  <div id="gameover">
    <h2>MISSION FAILED!</h2>
    <p>Final Score: <span id="finalScore">0</span></p>
    <button id="restart">PLAY AGAIN ↻</button>
  </div>

  <div class="hint">
    Swipe left/right to move • Swipe up to jump
  </div>

  <div id="controls">
    <div class="controlGroup">
      <button class="btn" id="left">◀</button>
      <button class="btn" id="right">▶</button>
    </div>
    <button class="btn" id="jump">⬆</button>
  </div>

</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";

import { GLTFLoader } from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";

(() => {
"use strict";

const $ = id => document.getElementById(id);

// ---------- SCENE ----------

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x9bc7e6);
scene.fog = new THREE.Fog(0x9bc7e6, 35, 145);

const camera = new THREE.PerspectiveCamera(
  65, innerWidth / innerHeight, 0.1, 250
);

camera.position.set(0, 4.1, 9);
camera.lookAt(0, 1.2, -5);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: "high-performance"
});

renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);

// Lighting

scene.add(new THREE.HemisphereLight(
  0xd8ecff, 0x34442a, 2.0
));

const sun = new THREE.DirectionalLight(0xfff1d5, 3);

sun.position.set(-12, 22, 10);
sun.castShadow = true;

sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -15;
sun.shadow.camera.right = 15;
sun.shadow.camera.top = 20;
sun.shadow.camera.bottom = -15;

scene.add(sun);

// ---------- MATERIALS ----------

function material(color, roughness = 1) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness
  });
}

const grassMaterial = material(0x506a39);
const roadMaterial = material(0x625f52);
const lineMaterial = material(0xd7cfb1);
const treeMaterial = material(0x31532a);
const treeMaterial2 = material(0x476b32);
const barkMaterial = material(0x56402c);
const rockMaterial = material(0x686b61);
const crateMaterial = material(0x745334);
const darkMaterial = material(0x353c30);
const goldMaterial = new THREE.MeshStandardMaterial({
  color: 0xffc928,
  metalness: 0.65,
  roughness: 0.22,
  emissive: 0x654000
});

// ---------- ENVIRONMENT ----------

// Ground

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(220, 240),
  grassMaterial
);

ground.rotation.x = -Math.PI / 2;
ground.position.set(0, -0.3, -75);
ground.receiveShadow = true;

scene.add(ground);

// Running track

const road = new THREE.Mesh(
  new THREE.PlaneGeometry(8, 230),
  roadMaterial
);

road.rotation.x = -Math.PI / 2;
road.position.set(0, -0.27, -75);
road.receiveShadow = true;

scene.add(road);

// Road edges

for (const x of [-3.9, 3.9]) {
  const edge = new THREE.Mesh(
    new THREE.BoxGeometry(0.12, 0.08, 230),
    lineMaterial
  );

  edge.position.set(x, -0.19, -75);
  scene.add(edge);
}

// Road markings

const markings = [];

for (let z = -190; z < 12; z += 8) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(0.09, 0.025, 3.3),
    lineMaterial
  );

  m.position.set(0, -0.18, z);
  scene.add(m);
  markings.push(m);
}

// Mountains

const mountainColors = [
  0x718c91,
  0x829a9a,
  0x9aa9a0,
  0x687f79
];

for (let i = 0; i < 36; i++) {
  const side = i % 2 === 0 ? -1 : 1;

  const h = 7 + Math.random() * 15;
  const r = 5 + Math.random() * 9;

  const mountain = new THREE.Mesh(
    new THREE.ConeGeometry(r, h, 6),
    material(mountainColors[i % mountainColors.length])
  );

  mountain.position.set(
    side * (10 + Math.random() * 20),
    h / 2 - 1,
    -15 - Math.random() * 160
  );

  mountain.rotation.y = Math.random() * 2;
  scene.add(mountain);
}

// Trees

const trees = [];

function makeTree(x, z) {
  const group = new THREE.Group();
  group.position.set(x, 0, z);

  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.16, 0.27, 2.4, 7),
    barkMaterial
  );

  trunk.position.y = 1.2;
  trunk.castShadow = true;
  group.add(trunk);

  for (let i = 0; i < 3; i++) {
    const crown = new THREE.Mesh(
      new THREE.ConeGeometry(
        1.15 - i * 0.12,
        1.8,
        7
      ),
      i % 2 ? treeMaterial2 : treeMaterial
    );

    crown.position.y = 2.4 + i * 0.8;
    crown.position.x = (Math.random() - 0.5) * 0.25;
    crown.castShadow = true;

    group.add(crown);
  }

  scene.add(group);
  trees.push(group);
}

for (let z = -185; z < 15; z += 8) {
  makeTree(-5.6 - Math.random() * 3, z);
  makeTree(5.6 + Math.random() * 3, z - 3);
}

// Rocks

const rocks = [];

function makeRock(x, z) {
  const rock = new THREE.Mesh(
    new THREE.DodecahedronGeometry(
      0.7 + Math.random() * 0.8, 0
    ),
    rockMaterial
  );

  rock.position.set(x, 0.15, z);
  rock.scale.y = 0.65;
  rock.rotation.set(
    Math.random(),
    Math.random() * 3,
    Math.random()
  );

  rock.castShadow = true;
  rock.receiveShadow = true;

  scene.add(rock);
  rocks.push(rock);
}

for (let z = -170; z < 10; z += 13) {
  makeRock(-5.0 - Math.random() * 2, z);
  makeRock(5.0 + Math.random() * 2, z - 5);
}

// ---------- SOLDIER MODEL ----------

const player = new THREE.Group();
player.position.set(0, 0, 2);
scene.add(player);

let soldier = null;
let mixer = null;
let runAction = null;
let idleAction = null;

const loader = new GLTFLoader();

let gameReady = false;

// Public Three.js sample Soldier model.
// Internet access is required to download the model.

loader.load(
  "https://threejs.org/examples/models/gltf/Soldier.glb",

  gltf => {
    soldier = gltf.scene;

    soldier.scale.setScalar(1);

    // Face the direction of travel.
    soldier.rotation.y = Math.PI;

    soldier.traverse(object => {
      if (object.isMesh) {
        object.castShadow = true;
        object.receiveShadow = true;
      }
    });

    player.add(soldier);

    mixer = new THREE.AnimationMixer(soldier);

    const clips = gltf.animations;

    const runClip = THREE.AnimationClip.findByName(clips, "Run");
    const idleClip = THREE.AnimationClip.findByName(clips, "Idle");

    if (runClip) {
      runAction = mixer.clipAction(runClip);
      runAction.play();
    } else if (clips.length) {
      runAction = mixer.clipAction(clips[0]);
      runAction.play();
    }

    if (idleClip) {
      idleAction = mixer.clipAction(idleClip);
    }

    $("loadingText").textContent =
      "3D Soldier loaded successfully!";

    $("start").style.display = "inline-block";

    gameReady = true;
  },

  undefined,

  error => {
    console.error("Soldier model could not load:", error);

    $("loadingText").innerHTML =
      "Soldier model load nahi hua.<br>" +
      "Internet connection check karke page reload karo.";

    $("start").style.display = "none";
  }
);

// ---------- ARMY CAMP ----------

const camp = new THREE.Group();
camp.position.set(0, 0, -100);
scene.add(camp);

// Gate

const gateMaterial = material(0x394431);

function addBox(parent, x, y, z, w, h, d, mat) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    mat
  );

  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;

  parent.add(mesh);
  return mesh;
}

addBox(camp, -5, 2.1, 0, 0.35, 4.2, 0.35, gateMaterial);
addBox(camp, 5, 2.1, 0, 0.35, 4.2, 0.35, gateMaterial);
addBox(camp, 0, 4.05, 0, 10.3, 0.35, 0.35, gateMaterial);

const signCanvas = document.createElement("canvas");
signCanvas.width = 512;
signCanvas.height = 128;

const ctx = signCanvas.getContext("2d");

ctx.fillStyle = "#263a26";
ctx.fillRect(0, 0, 512, 128);

ctx.fillStyle = "#ffffff";
ctx.font = "bold 54px Arial";
ctx.textAlign = "center";
ctx.fillText("ARMY BASE", 256, 80);

const signTexture = new THREE.CanvasTexture(signCanvas);

const sign = new THREE.Mesh(
  new THREE.PlaneGeometry(5.8, 1.45),
  new THREE.MeshBasicMaterial({ map: signTexture })
);

sign.position.set(0, 3.8, 0.22);
camp.add(sign);

// ---------- OBSTACLES AND COINS ----------

const lanes = [-2.35, 0, 2.35];

const objects = [];

let lane = 1;
let score = 0;
let coins = 0;
let speed = 17;
let spawnTimer = 0;
let coinTimer = 0;
let jumpVelocity = 0;
let elapsed = 0;

let running = false;
let paused = false;
let gameOver = false;

function spawnObstacle() {
  const group = new THREE.Group();

  group.position.set(
    lanes[Math.floor(Math.random() * 3)],
    0,
    -95
  );

  if (Math.random() < 0.5) {
    // Wooden crate

    addBox(
      group, 0, 0.65, 0,
      1.15, 1.3, 1,
      crateMaterial
    );

    addBox(
      group, 0, 0.65, -0.51,
      1.05, 0.07, 0.04,
      darkMaterial
    );

    addBox(
      group, 0, 0.65, 0.51,
      1.05, 0.07, 0.04,
      darkMaterial
    );
  } else {
    // Barricade

    addBox(
      group, 0, 0.6, 0,
      1.65, 1.2, 0.4,
      darkMaterial
    );

    for (const y of [0.25, 0.85]) {
      addBox(
        group, 0, y, -0.22,
        1.65, 0.18, 0.08,
        material(0xe0c44e)
      );
    }
  }

  scene.add(group);

  objects.push({
    mesh: group,
    type: "obstacle",
    hit: false
  });
}

function spawnCoin() {
  const group = new THREE.Group();

  group.position.set(
    lanes[Math.floor(Math.random() * 3)],
    1.5,
    -95
  );

  const coin = new THREE.Mesh(
    new THREE.TorusGeometry(0.32, 0.1, 10, 18),
    goldMaterial
  );

  coin.castShadow = true;
  group.add(coin);

  scene.add(group);

  objects.push({
    mesh: group,
    type: "coin",
    hit: false
  });
}

// ---------- CONTROLS ----------

function moveLeft() {
  if (!running || paused || gameOver) return;
  lane = Math.max(0, lane - 1);
}

function moveRight() {
  if (!running || paused || gameOver) return;
  lane = Math.min(2, lane + 1);
}

function jump() {
  if (!running || paused || gameOver) return;

  if (player.position.y < 0.03) {
    jumpVelocity = 9;
  }
}

$("left").addEventListener("pointerdown", e => {
  e.preventDefault();
  moveLeft();
});

$("right").addEventListener("pointerdown", e => {
  e.preventDefault();
  moveRight();
});

$("jump").addEventListener("pointerdown", e => {
  e.preventDefault();
  jump();
});

$("pause").addEventListener("click", () => {
  if (!gameReady || gameOver) return;

  paused = !paused;
  $("pause").textContent = paused ? "▶" : "Ⅱ";
});

$("start").addEventListener("click", () => {
  $("loading").style.display = "none";
  running = true;
});

$("restart").addEventListener("click", () => {
  objects.forEach(object => scene.remove(object.mesh));
  objects.length = 0;

  lane = 1;
  score = 0;
  coins = 0;
  speed = 17;
  spawnTimer = 0;
  coinTimer = 0;
  jumpVelocity = 0;
  elapsed = 0;

  player.position.set(0, 0, 2);

  gameOver = false;
  paused = false;
  running = true;

  $("score").textContent = "0";
  $("coins").textContent = "0";
  $("gameover").style.display = "none";
  $("pause").textContent = "Ⅱ";
});

// Keyboard controls

window.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") {
    moveLeft();
  }

  if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
    moveRight();
  }

  if (e.key === "ArrowUp" || e.key === " ") {
    jump();
  }
});

// Swipe controls

let touchX = 0;
let touchY = 0;

renderer.domElement.addEventListener("touchstart", e => {
  if (!e.touches.length) return;

  touchX = e.touches[0].clientX;
  touchY = e.touches[0].clientY;
}, { passive: true });

renderer.domElement.addEventListener("touchend", e => {
  if (!e.changedTouches.length) return;

  const dx = e.changedTouches[0].clientX - touchX;
  const dy = e.changedTouches[0].clientY - touchY;

  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 35) {
    dx < 0 ? moveLeft() : moveRight();
  } else if (dy < -35) {
    jump();
  }
}, { passive: true });

// ---------- GAME OVER ----------

function endGame() {
  gameOver = true;
  running = false;

  $("finalScore").textContent = Math.floor(score);
  $("gameover").style.display = "block";
}

// ---------- GAME LOOP ----------

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.04);

  if (running && !paused && !gameOver) {
    elapsed += dt;

    speed = Math.min(27, 17 + elapsed * 0.12);
    score += dt * 10;

    $("score").textContent = Math.floor(score);

    // Road markings

    markings.forEach(marking => {
      marking.position.z += speed * dt;

      if (marking.position.z > 12) {
        marking.position.z -= 208;
      }
    });

    // Trees

    trees.forEach(tree => {
      tree.position.z += speed * dt * 0.8;

      if (tree.position.z > 15) {
        tree.position.z -= 200;
      }
    });

    // Rocks

    rocks.forEach(rock => {
      rock.position.z += speed * dt * 0.8;

      if (rock.position.z > 15) {
        rock.position.z -= 200;
      }
    });

    // Spawn objects

    spawnTimer += dt;
    coinTimer += dt;

    if (spawnTimer > Math.max(0.7, 1.25 - elapsed * 0.002)) {
      spawnTimer = 0;
      spawnObstacle();
    }

    if (coinTimer > 1.1) {
      coinTimer = 0;
      spawnCoin();
    }

    // Smooth lane changes

    player.position.x +=
      (lanes[lane] - player.position.x) *
      Math.min(1, dt * 9);

    // Jump

    if (player.position.y > 0 || jumpVelocity > 0) {
      player.position.y += jumpVelocity * dt;
      jumpVelocity -= 23 * dt;

      if (player.position.y < 0) {
        player.position.y = 0;
        jumpVelocity = 0;
      }
    }

    // Update real 3D animation

    if (mixer) {
      mixer.update(dt);
    }

    // Move obstacles and collect coins

    for (let i = objects.length - 1; i >= 0; i--) {
      const object = objects[i];

      object.mesh.position.z += speed * dt;

      if (object.type === "coin") {
        object.mesh.rotation.y += dt * 3;
        object.mesh.position.y =
          1.5 + Math.sin(elapsed * 4 + i) * 0.15;
      }

      const dz = Math.abs(
        object.mesh.position.z - player.position.z
      );

      const dx = Math.abs(
        object.mesh.position.x - player.position.x
      );

      if (!object.hit && dz < 0.9 && dx < 0.9) {
        if (object.type === "coin") {
          object.hit = true;
          coins++;
          score += 25;

          $("coins").textContent = coins;

          scene.remove(object.mesh);
          objects.splice(i, 1);
          continue;
        }

        if (player.position.y < 0.9) {
          endGame();
          break;
        }
      }

      if (object.mesh.position.z > 12) {
        scene.remove(object.mesh);
        objects.splice(i, 1);
      }
    }
  }

  // Camera follows player

  camera.position.x +=
    (player.position.x * 0.35 - camera.position.x) *
    Math.min(1, dt * 3);

  camera.lookAt(
    player.position.x * 0.2,
    1.2 + player.position.y * 0.25,
    -5
  );

  renderer.render(scene, camera);
}

// ---------- RESIZE ----------

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
});

animate();

})();
</script>

</body>
      </html>
